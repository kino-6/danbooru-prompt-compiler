[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danbooru-prompt-compiler"
version = "0.1.0"
description = "Local-first CLI for converting natural language scene descriptions into Danbooru-style prompts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "danbooru-prompt-compiler contributors" }]
dependencies = [
  "huggingface-hub>=0.23.0",
  "numpy>=1.26.0",
  "onnxruntime>=1.17.0",
  "pillow>=10.0.0",
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
web = ["gradio>=6.0.0,<7.0.0"]

[dependency-groups]
test = ["pytest>=8.0.0"]
web-test = ["pytest-playwright>=0.7.0,<1.0.0"]

[project.scripts]
danbooru-prompt = "danbooru_prompt_compiler.cli:app"
danbooru-prompt-web = "danbooru_prompt_compiler.webui:web_app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

label: ポスター／キービジュアル
order: 40
task: Describe a key visual poster.
sections:
  Subject: the hero figure or object and its silhouette
  Setting: backdrop and supporting elements behind the subject
  Lighting: dramatic lighting scheme and rim or accent light
  Palette: dominant colours and the accent colour
  Layout: composition, negative space reserved for typography, aspect ratio
  Details: graphic motifs, textures, and effects
delivery: A high-resolution key visual with clear negative space for a title, rendered without any lettering.

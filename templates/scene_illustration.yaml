label: シーンイラスト
order: 30
task: Describe one finished illustration of a scene.
sections:
  Subject: the main figure or figures and what they are doing
  Setting: place, season, time of day, weather
  Lighting: light sources, direction, softness, shadow behaviour
  Materials: surface qualities - fabric, skin, metal, water, foliage
  Layout: composition, camera height and distance, depth layers
  Details: foreground and background elements that carry the story
  Mood: the emotional register of the image
delivery: A single finished illustration, no text or panel borders.
